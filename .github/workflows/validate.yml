name: Validate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: xdk-amz/valkey-perf-benchmark
          ref: c67c4e89d33d7833fa7b875acd802a8e9f69c1fe
          path: vpb
          persist-credentials: false
      - name: Check schema, fingerprints, location and identifiers
        working-directory: vpb
        run: python3 -m dashboards.explorer check ../data --data-root ../data
